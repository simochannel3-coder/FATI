<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FIRST ANIMATION -->

  <div id="intro" class="intro">

      <h1 class="birthday-text">
        Happy Birthday ❤️
      </h1>

      <div class="main-heart"></div>

      <button class="start-btn" onclick="showWays()">
        Open Surprise 💌
      </button>

  </div>


  <!-- WAYS -->

  <div id="ways" class="ways hidden">

      <h1>Choose Your Way ❤️</h1>

      <div class="buttons">

          <button onclick="showWay1()">
            Way 1 💌
          </button>

          <button onclick="showWay2()">
            Way 2 ❤️
          </button>

      </div>

  </div>


  <!-- WAY 1 -->

  <div id="way1" class="hidden">

      <h1 class="way-title">
        Open The Letters ❤️
      </h1>

      <div class="letters-container">

          <div class="letter" onclick="openLetter(0)">💌</div>
          <div class="letter" onclick="openLetter(1)">💖</div>
          <div class="letter" onclick="openLetter(2)">🌹</div>
          <div class="letter" onclick="openLetter(3)">💕</div>
          <div class="letter" onclick="openLetter(4)">✨</div>
          <div class="letter" onclick="openLetter(5)">❤️</div>
          <div class="letter" onclick="openLetter(6)">💞</div>
          <div class="letter" onclick="openLetter(7)">🥰</div>

      </div>

      <div id="messageBox" class="message-box"></div>

      <button id="nextBtn" class="next-btn" onclick="showWay2()">
        Continue To Way 2 ❤️
      </button>

  </div>


  <!-- WAY 2 -->

  <div id="way2" class="hidden heart-page">

      <div class="big-heart"></div>

      <h1 class="love-text">
        KANBGHIIIIIIIIIIIK ❤️
      </h1>

  </div>

  <script src="script.js"></script>

</body>
</html>
