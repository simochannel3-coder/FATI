<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- START SCREEN -->
<div class="start-screen" id="startScreen">

    <h1 class="birthday-title">
        Happy Birthday ❤️
    </h1>

    <p class="subtitle">
        A special surprise for you 💌
    </p>

    <button class="start-btn" onclick="showChoices()">
        Open Surprise 🎁
    </button>

</div>

<!-- WAYS -->
<div class="choices" id="choices">

    <h2>Choose Your Way 💖</h2>

    <div class="buttons">

        <button onclick="showWay1()">
            Way 1 💌
        </button>

        <button onclick="showWay2()">
            Way 2 ❤️
        </button>

    </div>

</div>

<!-- WAY 1 -->
<div class="letters-container" id="lettersContainer">

    <div class="envelope" onclick="openMessage(0)">
        💌
    </div>

    <div class="envelope" onclick="openMessage(1)">
        💖
    </div>

    <div class="envelope" onclick="openMessage(2)">
        🌹
    </div>

    <div class="envelope" onclick="openMessage(3)">
        💕
    </div>

    <div class="envelope" onclick="openMessage(4)">
        ✨
    </div>

    <div class="envelope" onclick="openMessage(5)">
        ❤️
    </div>

</div>

<!-- MESSAGE POPUP -->
<div class="message-popup" id="messagePopup">

    <div class="message-box">

        <h2>My Love ❤️</h2>

        <p id="messageText"></p>

        <button onclick="closePopup()">
            Close 💌
        </button>

    </div>

</div>

<!-- WAY 2 -->
<div id="popup"></div>

<script src="script.js"></script>

</body>
</html>
