<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1 class="title">
      Happy Birthday ❤️
    </h1>

    <p class="subtitle">
      Choose your surprise 💌
    </p>

    <div class="letters-container">

      <div class="letter" onclick="openLetter(0)">
        💌
      </div>

      <div class="letter" onclick="openLetter(1)">
        💖
      </div>

      <div class="letter" onclick="openLetter(2)">
        🌹
      </div>

      <div class="letter" onclick="openLetter(3)">
        💕
      </div>

      <div class="letter" onclick="openLetter(4)">
        ✨
      </div>

      <div class="letter" onclick="openLetter(5)">
        ❤️
      </div>

    </div>

    <div id="messageBox" class="message-box"></div>

    <button id="way2Btn" class="way2-btn" onclick="showHeart()">
      Go To Way 2 ❤️
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
