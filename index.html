<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO -->

<div class="intro-screen" id="intro">

<h1 class="main-title">
Happy Birthday 3mri ❤️
</h1>

<p class="sub">
The most beautiful girl in my life ✨
</p>

<img
src="https://raw.githubusercontent.com/simochannel3-coder/FATI/main/WhatsApp%20Image%202026-05-23%20at%2001.51.49.jpeg"
class="main-photo"
>

<button class="open-btn" onclick="showWays()">
Open Surprise 💌
</button>

</div>

<!-- WAYS -->

<div class="ways hidden" id="ways">

<h1>Choose Your Surprise 💖</h1>

<div class="buttons">

<button onclick="showWay1()">
Way 1 💌
</button>

<button onclick="showWay2()">
Way 2 ❤️
</button>

</div>

</div>

<!-- WAY 1 -->

<div class="way1 hidden" id="way1">

<h1 class="for-you">
For You ❤️
</h1>

<div class="letters">

<div class="letter" onclick="showMessage(0)">💌</div>
<div class="letter" onclick="showMessage(1)">💖</div>
<div class="letter" onclick="showMessage(2)">🌹</div>
<div class="letter" onclick="showMessage(3)">❤️</div>
<div class="letter" onclick="showMessage(4)">✨</div>
<div class="letter" onclick="showMessage(5)">💘</div>
<div class="letter" onclick="showMessage(6)">🥰</div>
<div class="letter" onclick="showMessage(7)">💕</div>

</div>

<div class="message-box">
<p id="message"></p>
</div>

<button class="continue hidden" id="continueBtn" onclick="showWay2()">
Continue To Way 2 ❤️
</button>

</div>

<!-- WAY 2 -->

<div class="way2 hidden" id="way2">

<div class="heart">

<img
src="https://raw.githubusercontent.com/simochannel3-coder/FATI/main/WhatsApp%20Image%202026-05-23%20at%2001.51.49.jpeg"
class="heart-photo"
>

</div>

<h1 class="love-text">
KANBGHIIIIIIIIIIIIK HABIBATI ❤️
</h1>

</div>

<script src="script.js"></script>

</body>
</html>
